version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prediction_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prediction_api
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2
    restart: unless-stopped
